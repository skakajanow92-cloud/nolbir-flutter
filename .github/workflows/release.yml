name: Release

# Bir sürüm tag'i push edildiğinde tetiklenir: git tag v1.0.0 && git push origin v1.0.0
# İstersen Actions sekmesinden manuel de tetikleyebilirsin (workflow_dispatch).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip the exe bundle
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nolbir-windows.zip
        shell: pwsh

      - name: Build .msix
        run: |
          dart pub add --dev msix
          dart run msix:create
        # pubspec.yaml içinde msix_config bloğu olmalı (bir önceki mesajdaki örnek gibi)

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            nolbir-windows.zip
            build/windows/x64/runner/Release/*.msix

  build-linux:
    runs-on: ubuntu-24.04 # senin lokal Ubuntu 24.04 ile birebir aynı ortam
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Package .deb
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutter_distributor package --platform linux --targets deb

      - name: Package .AppImage
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutter_distributor package --platform linux --targets appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/**/*.deb
            dist/**/*.AppImage

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Get packages
        run: flutter pub get

      # ---- İmzalama için gizli anahtarlar ----
      # Repo Settings > Secrets and variables > Actions içine ekle:
      #   ANDROID_KEYSTORE_BASE64  -> `base64 -i upload-keystore.jks | pbcopy` (mac) veya `base64 upload-keystore.jks` (linux)
      #   ANDROID_STORE_PASSWORD
      #   ANDROID_KEY_PASSWORD
      #   ANDROID_KEY_ALIAS
      # android/app/build.gradle içinde signingConfigs.release bu key.properties'i okumalı
      # (bkz. Flutter resmi dokümanı: "Build and release an Android app")
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (Play Store)
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip the .app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/nolbir-macos.zip" *.app

      # Not: Bu .dmg imzasız/notarize edilmemiş olur; kullanıcı ilk açılışta
      # Gatekeeper uyarısı görebilir. Notarization için Apple Developer ID
      # sertifikası + `xcrun notarytool` adımı eklenmesi gerekir (ayrı secrets ister).
      - name: Create .dmg
        run: |
          hdiutil create -volname "Nolbir" \
            -srcfolder "build/macos/Build/Products/Release" \
            -ov -format UDZO nolbir-macos.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            nolbir-macos.zip
            nolbir-macos.dmg

  release:
    needs: [build-windows, build-linux, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-artifacts/*
            artifacts/linux-artifacts/**/*
            artifacts/android-artifacts/**/*
            artifacts/macos-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
