org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9'un built-in Kotlin desteğini açık tutuyoruz, ama Flutter'ın kendi
# Gradle plugin'i şu an "new DSL" ile bir ClassCastException veriyor
# (görünüşe göre Flutter 3.47.4'ün bilinen bir sınırlaması). Hata mesajının
# önerdiği gibi bunu "false"a çekiyoruz.
android.builtInKotlin=true
android.newDsl=false
