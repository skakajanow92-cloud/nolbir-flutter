org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9 kullanıyoruz ama built-in Kotlin migration'ına GEÇMİYORUZ — klasik
# kotlin-android plugin'i (modern bir sürümle) kullanmaya devam ediyoruz.
# Bu, Flutter'ın "AGP 9 + built-in Kotlin disabled" olarak resmi desteklediği
# kombinasyon.
android.builtInKotlin=false
android.newDsl=false
