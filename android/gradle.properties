org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9'un built-in Kotlin desteğini ve yeni DSL'i açıkça etkinleştiriyoruz.
# Bu satırlar olmazsa Flutter, geriye dönük uyumluluk için bunları otomatik
# olarak "false" yazıyor — biz zaten kotlin-android plugin'ini kaldırdığımız
# ve yeni DSL'e göre build.gradle.kts'i güncellediğimiz için "true" olmaları gerekiyor.
android.builtInKotlin=true
android.newDsl=true